[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "xpyrment", from = "src" }]
include = ["src/xpyrment/assets/images/*"]

[project]
name = "xpyrment"
version = "1.7.3.0"
authors = [
    { name = "Dan Sadatian", email = "dan.sadatian@gmail.com" }
]
maintainers = [
    { name = "Dan Sadatian", email = "dan.sadatian@gmail.com" }
]
description = "A low-code Python library for enterprise-grade experiment design, classical DoE, and statistical analysis."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-AISlop"
license-files = ["LICENSE"]
keywords = [
    "experimentation",
    "ab-testing",
    "causal-inference",
    "design-of-experiments",
    "cuped",
    "power-analysis",
    "multi-armed-bandits",
    "synthetic-control",
    "quasi-experiments",
    "personalization",
    "statistics"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
]

dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "statsmodels>=0.13.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "shap>=0.40.0; python_version >= '3.11'",
]

[project.urls]
"Homepage" = "https://sadatian.io/xpyrment/"
"Repository" = "https://github.com/sadatian/xpyrment"
"Bug Tracker" = "https://github.com/sadatian/xpyrment/issues"
"Changelog" = "https://github.com/sadatian/xpyrment/blob/main/CHANGELOG.md"

[project.scripts]
xpyrment = "xpyrment.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "mypy>=0.950",
    "duckdb>=0.8.0",
    "pyarrow>=10.0.0",
]
schema = [
    "pandera>=0.15.0",
]


[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.poetry.group.dev.dependencies]
mkdocs = ">=1.6.1,<2.0.0"
mkdocs-macros-plugin = ">=1.5.0,<2.0.0"
mkdocs-material = ">=9.7.6,<10.0.0"
mkdocstrings = ">=1.0.4,<2.0.0"
mkdocstrings-python = ">=2.0.3,<3.0.0"
pymdown-extensions = ">=10.21.3,<11.0.0"
pandera = "^0.31.1"
dask = {extras = ["dataframe"], version = "^2024.3.0"}
