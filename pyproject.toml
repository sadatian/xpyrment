[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xpyrment"
version = "1.1.2.5"
authors = [
    { name = "Dan Sadatian", email = "dan.sadatian@gmail.com" }
]
maintainers = [
    { name = "Dan Sadatian", email = "dan.sadatian@gmail.com" }
]
description = "A low-code Python library for enterprise-grade experiment design, classical DoE, and statistical analysis."
readme = "README.md"
requires-python = ">=3.8"
license = "LicenseRef-AISlop"
license-files = ["LICENSE"]
keywords = [
    "experimentation",
    "ab-testing",
    "causal-inference",
    "design-of-experiments",
    "cuped",
    "power-analysis",
    "multi-armed-bandits",
    "synthetic-control",
    "quasi-experiments",
    "personalization",
    "statistics"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
]

dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "statsmodels>=0.13.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
]

[project.urls]
"¹ Homepage" = "https://sadatian.io/xpyrment/"
"² Repository" = "https://github.com/sadatian/xpyrment"
"³ Bug Tracker" = "https://github.com/sadatian/xpyrment/issues"
"⁴ Changelog" = "https://github.com/sadatian/xpyrment/blob/main/CHANGELOG.md"

[project.scripts]
xpyrment = "xpyrment.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "mypy>=0.950",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["xpyrment*"]

[tool.setuptools.package-data]
xpyrment = ["assets/images/*"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 88
